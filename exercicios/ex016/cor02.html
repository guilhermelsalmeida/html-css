<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente Em CSS</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <style>
        * { /* Configurações globais das CSS */
            height:100%;
        }
        body {
            background-image: linear-gradient(to bottom, #3198E2 20%, #6D59C0, #B93590, #E33F5F, #FDD579 95%);
            background-attachment: fixed;
        }
        text {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 20px;
    </style>
</head>
<body>
 <h1 style="font-size: 50px; text-align: center;">TESTANDO GRADIENTES</h1>
   
</body>
</html>
