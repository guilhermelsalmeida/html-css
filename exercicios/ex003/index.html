<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste com imagens</title>
</head>

<body>
    <h1>Testando carga de imagens.</h1>
    <p>Abaixo você vai ver uma imagem que está na mesma pasta.</p>
    <img src="logohtml.png" alt="logo da linguagem HTML5">
    <!-- Para colocar arquivos na tag img, basta deixar o cursor entre as aspas em src"" e pressoionar CTRL+ barra de espaço -->
    
    <p>Podemos, também, carregar imagens que estão em subpastas.</p>
    <img src="imagens/logocss.png" alt="logo CSS3, que é uma ferramenta de inserção de design em páginas web">
    
    <p>Também podemos carregar imagens externas.</p>
    <img src="https://logospng.org/download/javascript/logo-javascript-256.png" alt="logo da linguagem de programação JavaScript">
    <!-- Para inserir imagens externas, basta copiar o endereço de uma imagem na web e colar entre as aspas de src -->

</body>

</html>
