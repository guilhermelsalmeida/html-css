<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            background-color: #727272; /* ; #313131 */
            border-collapse: collapse;
            width: 50%;
            margin: auto;
        }

        caption {
            font-size: 1.5em;
            font-weight: bold;
            font-variant: small-caps;
            padding: 10px;
            background-color: #000068;
        }

        th {
            border: 1px solid #fff;
            padding: 10px;
        }

        .destaque {
            background-color: #313131;
        }

        td {
            border: 1px solid #fff;
            padding: 10px;
        }

        .dado {
            text-align: center;
        }
    </style>
</head>
<body>

    <table>

        <caption>Boletim Escolar</caption>

        <thead>
            <tr>
                <th rowspan="2" scope="col" class="destaque">Área</th>
                <th rowspan="2" scope="col" class="destaque">Disciplina</th>
                <th colspan="2" scope="colgroup" class="destaque">Nota</th>
                <th rowspan="2" scope="col" class="destaque">Média</th>
            </tr>
            <tr>
                <th scope="col" class="destaque">Nota 01</th>
                <th scope="col" class="destaque">Nota 02</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th rowspan="4" scope="rowgroup">Exatas</th>
                <td>Matemática</td>
                <td class="dado">0.0</td>
                <td class="dado">0.0</td>
                <td class="dado">0.0</td>
            </tr>
            <tr>
                <td>Física</td>
                <td class="dado">0.0</td>
                <td class="dado">0.0</td>
                <td class="dado">0.0</td>
            </tr>
            <tr>
                <td>Química</td>
                <td class="dado">0.0</td>
                <td class="dado">0.0</td>
                <td class="dado">0.0</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td class="dado">0.0</td>
                <td class="dado">0.0</td>
                <td class="dado">0.0</td>
            </tr>
            <tr>
                <th colspan="4" scope="row" class="destaque" style="text-align: left;">Média de Exatas</th>
                <td class="dado destaque">0.0</td>
            </tr>
            <tr>
                <th rowspan="2" scope="rowgroup">Humanas</th>
                <td>História</td>
                <td class="dado">0.0</td>
                <td class="dado">0.0</td>
                <td class="dado">0.0</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td class="dado">0.0</td>
                <td class="dado">0.0</td>
                <td class="dado">0.0</td>
            </tr>
            <tr>
                <th colspan="4" scope="row" class="destaque" style="text-align: left;">Média de Humanas</th>
                <td class="dado destaque">0.0</td>
            </tr>
        </tbody>
    </table>
    
</body>
</html>
